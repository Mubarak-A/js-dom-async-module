<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Todo List</title>
  </head>
  <body>
    <div id="todocontainer">
      <section>
        <header>
          <h1>Interactive To Do List</h1>
        </header>
      </section>

      <section>
        <ul class="todolist">
          <li class="todolist_item">
            <input type="checkbox" id="todolist_item1_input" />
            <label for="todolist_item1_input" id="todolist_item1">
              <h5>Complete JavaScript course</h5>
            </label>
          </li>
          <li class="todolist_item">
            <input type="checkbox" id="todolist_item2_input" />
            <label for="todolist_item2_input" id="todolist_item2">
              <h5>Exercise</h5>
            </label>
          </li>
          <li class="todolist_item">
            <input type="checkbox" id="todolist_item3_input" />
            <label for="todolist_item3_input" id="todolist_item3">
              <h5>10 minutes meditation</h5>
            </label>
          </li>
          <li class="todolist_item">
            <input type="checkbox" id="todolist_item4_input" />
            <label for="todolist_item4_input" id="todolist_item4">
              <h5>Read for 5 hours</h5>
            </label>
          </li>
          <li class="todolist_item">
            <input type="checkbox" id="todolist_item5_input" />
            <label for="todolist_item5_input" id="todolist_item5">
              <h5>Pick up groceries</h5>
            </label>
          </li>
          <li class="todolist_item">
            <input type="checkbox" id="todolist_item6_input" />
            <label for="todolist_item6_input" id="todolist_item6">
              <h5>Complete Todo App Assignment</h5>
            </label>
          </li>
        </ul>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
